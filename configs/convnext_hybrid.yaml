# ConvNeXt hybrid model (image + metadata fusion)
# Inherits and overrides base_config.yaml

model:
  name: "convnext_hybrid"
  input_size: 224
  pretrained: true
  dropout: 0.3
  metadata_enabled: true       # enables the metadata encoder branch
  metadata_hidden_dim: 64      # hidden dimension for the metadata MLP
  fusion_hidden_dim: 256       # hidden dimension for the fusion head

training:
  epochs: 60
  batch_size: 16
  learning_rate: 0.00005
  weight_decay: 0.0001
  early_stopping_patience: 12
  mixed_precision: true
  deterministic: true
  num_workers: 4
  pin_memory: true

scheduler:
  name: "cosine"
  warmup_epochs: 3
  min_lr: 0.0000001

task:
  type: "regression"
  num_classes: 1
