# EfficientNet-B4 image-only baseline
# Inherits and overrides base_config.yaml

model:
  name: "efficientnet"
  input_size: 380           # EfficientNet-B4 native resolution
  pretrained: true
  dropout: 0.4
  metadata_enabled: false

training:
  epochs: 50
  batch_size: 12            # smaller batch due to larger input resolution
  learning_rate: 0.00005
  weight_decay: 0.0001
  early_stopping_patience: 10
  mixed_precision: true
  deterministic: true
  num_workers: 4
  pin_memory: true

scheduler:
  name: "cosine"
  warmup_epochs: 2
  min_lr: 0.0000001

task:
  type: "regression"
  num_classes: 1
