# InceptionV3 image-only baseline
# Inherits and overrides base_config.yaml

model:
  name: "inception"
  input_size: 299           # InceptionV3 requires 299×299
  pretrained: true
  dropout: 0.3
  metadata_enabled: false

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 10
  mixed_precision: true
  deterministic: true
  num_workers: 4
  pin_memory: true

scheduler:
  name: "cosine"
  warmup_epochs: 2
  min_lr: 0.000001

task:
  type: "regression"
  num_classes: 1
